<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Texas Rail Network Sketch</title>
<meta name="description" content="An interactive metro-style concept map for a Texas rail and intercity bus network.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-mode="explore">
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 44 44" aria-hidden="true">
        <path d="M6 30 L18 18 H38" fill="none" stroke="#d7263d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 38 H26 L38 26" fill="none" stroke="#3a9ad9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="18" r="5" stroke-width="2.4" style="fill:var(--station);stroke:var(--ink)"/>
        <circle cx="26" cy="38" r="4" stroke-width="2.4" style="fill:var(--station);stroke:var(--ink)"/>
      </svg>
      <div>
        <h1>Texas Rail Network Sketch</h1>
        <p>A concept network of high-speed, intercity, regional rail and bus lines across every Texas city over 25,000, laid over the rail that runs today.</p>
      </div>
    </div>
    <div class="top-actions">
      <nav class="pages" aria-label="Pages">
        <a href="index.html" aria-current="page">Concept map</a>
        <a href="build.html">Network builder</a>
      </nav>
      <div class="seg" role="group" aria-label="Map layout">
        <button type="button" id="btnDiagram" aria-pressed="true">Diagram</button>
        <button type="button" id="btnGeo" aria-pressed="false">Geographic</button>
      </div>
      <button type="button" class="ghost" id="btnTheme">Dark map</button>
    </div>
  </header>
  <aside class="side" id="side" aria-label="Map controls"></aside>
  <main class="map" id="map">
    <svg id="svg" role="img" aria-label="Metro-style map of a concept Texas rail network">
      <g id="view"><g id="bgG"></g><g id="sugG"></g><g id="linesG"></g><g id="stationsG"></g><g id="labelsG"></g><g id="editG"></g></g>
    </svg>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zfit" class="small" aria-label="Fit map to screen">Fit</button>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="banner" id="banner" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <section class="info" id="info" hidden aria-live="polite"></section>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
