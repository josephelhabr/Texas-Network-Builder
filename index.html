<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Texas Rail Network Builder</title>
<meta name="description" content="Draw your own Texas rail and intercity bus network on a metro-style map.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ecf1; --panel:#f7f9fb; --field:#ffffff; --ink:#17202b; --ink-2:#4a5664;
  --muted:#9aa5b1; --rule:#d2dae2; --grid:#edf1f5; --halo:#ffffff; --focus:#0a62c2;
  --chip:#e2e8ee; --station:#ffffff; --land:#f1f4f7; --danger:#b42318; --base-mono:#3e4b5c;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="paper"]){
    --bg:#0c131b; --panel:#111a24; --field:#152029; --ink:#e5ecf2; --ink-2:#a7b4c1;
    --muted:#5f6f80; --rule:#243243; --grid:#1a2633; --halo:#152029; --focus:#6db3ff;
    --chip:#1c2937; --station:#152029; --land:#1a2633; --danger:#ff8a80; --base-mono:#c3ced9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c131b; --panel:#111a24; --field:#152029; --ink:#e5ecf2; --ink-2:#a7b4c1;
  --muted:#5f6f80; --rule:#243243; --grid:#1a2633; --halo:#152029; --focus:#6db3ff;
  --chip:#1c2937; --station:#152029; --land:#1a2633; --danger:#ff8a80; --base-mono:#c3ced9;
  color-scheme:dark;
}
:root[data-theme="paper"]{
  --bg:#e4dccb; --panel:#f3ede1; --field:#f8f3e9; --ink:#23211d; --ink-2:#5b554b;
  --muted:#a69f92; --rule:#d8cebb; --grid:#ece4d4; --halo:#f8f3e9; --focus:#0b5fb8;
  --chip:#e9e0cf; --station:#fffdf8; --land:#efe6d3; --danger:#a8321f; --base-mono:#4a4741;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:360px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}

/* Header */
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;
  padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{flex:none}
h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.top p{margin:3px 0 0;color:var(--ink-2);font-size:.86rem;max-width:66ch}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pages{display:inline-flex;gap:2px;background:var(--chip);border-radius:10px;padding:3px}
.pages a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.9rem}
.pages a[aria-current="page"]{background:var(--field);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pages a:hover{color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ghost{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.86rem}
.ghost:hover{background:var(--chip)}

/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-scroll{flex:1;min-height:0;overflow:auto;padding:16px 18px 24px}
.dock{flex:none;border-top:1px solid var(--rule);background:var(--panel);padding:10px 18px 12px;box-shadow:0 -6px 18px rgba(8,18,30,.07)}
.dock h2{font-size:.92rem;font-weight:700;margin:0}
.dock .hint{margin:2px 0 0;font-size:.8rem}
.dock .btns{margin-top:8px}
.acc-tools{display:flex;justify-content:flex-end;gap:2px;margin:12px 0 0}
.side section.acc{padding:0}
.side .acc-h{margin:0;font-size:1rem}
.acc-btn{width:100%;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;background:none;border:0;padding:13px 2px;cursor:pointer;text-align:left;border-radius:6px}
.acc-btn:hover{background:var(--chip)}
.acc-title{font-weight:700;font-size:1rem}
.acc-sum{font-size:.8rem;color:var(--ink-2);font-weight:600}
.chev{color:var(--ink-2);transition:transform .15s}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-panel{padding:2px 0 16px}
.seg2{display:flex;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
.seg2 button{flex:1;border:0;background:var(--field);padding:6px 8px;font-size:.82rem;font-weight:600;cursor:pointer;line-height:1.25}
.seg2 button+button{border-left:1.5px solid var(--rule)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px}
.tchip .swsvg{width:24px;height:10px}
.tchip em{font-style:normal;font-size:.76rem;opacity:.75}
.chip[aria-pressed="true"] .inkst{stroke:var(--panel)}
.chip[aria-pressed="true"] .core{stroke:var(--ink)}
.chip[aria-pressed="false"]{opacity:.7}
.pbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.preset small.added{color:var(--focus);font-weight:600}
.side section{padding:16px 0;border-top:1px solid var(--rule)}
.side h2{font-size:1rem;font-weight:700;margin:0 0 8px}
.side h3{font-size:.82rem;font-weight:700;color:var(--ink-2);margin:12px 0 4px}
.hint{margin:0 0 10px;color:var(--ink-2);font-size:.85rem}
.search label{display:block;font-weight:700;margin-bottom:6px}
.search input,.field input,.field select,select.sel{width:100%;padding:8px 11px;border:1.5px solid var(--rule);border-radius:8px;background:var(--field)}
.search input:focus,.field input:focus,.field select:focus{border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.stats div{background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.stats dt{font-size:.72rem;color:var(--ink-2);line-height:1.2}
.stats dd{margin:2px 0 0;font-size:1.25rem;font-weight:700;line-height:1.1}
.stats dd span{font-size:.75rem;font-weight:600;color:var(--ink-2)}

.trow{display:grid;grid-template-columns:auto 40px 1fr auto;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.trow strong{display:block;font-weight:700;line-height:1.2}
.trow small{display:block;color:var(--ink-2);font-size:.78rem}
.trow .cnt{font-size:.75rem;color:var(--ink-2);text-align:right;line-height:1.25}
.trow.off{opacity:.5}
input[type="checkbox"]{width:17px;height:17px;accent-color:var(--ink);margin:0;cursor:pointer}
.swsvg path{fill:none}
.inkst{stroke:var(--ink)}
.core{stroke:var(--field)}
.casing{stroke:var(--ink);stroke-opacity:.85}
.casing-in{stroke:var(--station)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;padding:2px 4px;color:var(--focus);cursor:pointer;font-size:.84rem;font-weight:600}
.link:hover{text-decoration:underline}
.link.danger{color:var(--danger)}
ul.lines{list-style:none;margin:0;padding:0}
ul.lines li{display:grid;grid-template-columns:auto 40px 1fr auto;align-items:center;gap:8px;padding:3px 0}
ul.lines li.muted{opacity:.45}
.lname{background:none;border:0;padding:3px 4px;text-align:left;cursor:pointer;border-radius:6px;min-width:0}
.lname:hover{background:var(--chip)}
.lname strong{display:block;font-weight:700;font-size:.9rem;line-height:1.2}
.lname small{display:block;color:var(--ink-2);font-size:.76rem;line-height:1.25}
.empty{color:var(--ink-2);font-size:.86rem;margin:6px 0 0}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:.88rem;padding:4px 0}
.opt{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.field{display:block;margin:8px 0}
.field span{display:block;font-size:.8rem;font-weight:700;margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer;font-size:.9rem}
.btn.alt{background:transparent;color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.preset{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule)}
.preset:last-child{border-bottom:0}
.preset strong{display:block;font-size:.9rem;line-height:1.2}
.preset small{display:block;color:var(--ink-2);font-size:.78rem}
.newline{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.citylist{list-style:none;margin:6px 0 0;padding:0}
.citylist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0;font-size:.88rem}
.fine{font-size:.76rem;color:var(--ink-2);margin:16px 0 0;border-top:1px solid var(--rule);padding-top:14px}
.fine a{color:inherit}

/* Map */
.map{position:relative;overflow:hidden;background:var(--field)}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.dragging{cursor:grabbing}
#svg.placing{cursor:crosshair}
.gridline{stroke:var(--grid);fill:none}
.land{fill:var(--land);stroke:var(--rule);stroke-width:2}
.landnote{fill:var(--muted);font-size:13px}
.ln{cursor:pointer}
.ln path{fill:none;stroke-linejoin:round;stroke-linecap:round}
.ln path.dash{stroke-linecap:butt}
.ln .hit{stroke:transparent}
.sug path{fill:none;stroke-linecap:round;cursor:pointer}
.sug .hit{stroke:transparent}
.dim{opacity:.12}
.stn{cursor:pointer}
.stn .hitc{fill:transparent}
.stn .dot{fill:var(--station);stroke:var(--ink)}
.stn.none .dot{fill:var(--muted);stroke:none}
.stn.custom .dot{fill:var(--station);stroke:var(--focus)}
.stn.airport .dot{fill:var(--ink);stroke:none}
.stn .ring{fill:none;stroke:var(--focus)}
.stn .local{fill:none}
.gw path{fill:var(--ink-2)}
.lbl{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.lbl.none{fill:var(--ink-2);font-weight:400}
.lbl.strong{font-weight:700}
.lbl.gw{font-style:italic;fill:var(--ink-2);font-weight:400}
.edit-ring{fill:none;stroke:var(--focus)}

.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);font-weight:700;font-size:1.1rem;cursor:pointer}
.zoom button.small{font-size:.78rem}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--panel);font-size:.8rem;
  padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:6}
.banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:8px 10px 8px 16px;border-radius:999px;font-weight:600;font-size:.88rem;max-width:calc(100% - 130px);
  display:flex;align-items:center;gap:10px;z-index:5}
.banner button{border:0;background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;cursor:pointer;font-size:.82rem;flex:none}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:8px 10px 8px 16px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:7;max-width:calc(100% - 40px);
  display:flex;align-items:center;gap:12px}
.toast button{border:0;background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;cursor:pointer;font-size:.84rem;flex:none}
.legend{position:absolute;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:8px 12px;font-size:.78rem;z-index:2;max-width:250px}
.legend div{display:flex;align-items:center;gap:8px;line-height:1.6}
.info{position:absolute;left:16px;bottom:58px;width:min(380px,calc(100% - 32px));max-height:calc(100% - 74px);overflow:auto;
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;box-shadow:0 8px 28px rgba(8,18,30,.2);z-index:4}
.info h3{margin:0 34px 2px 0;font-size:1.22rem;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:10px}
.info h4{margin:14px 0 6px;font-size:.86rem;font-weight:700}
.info .meta{margin:0;color:var(--ink-2);font-size:.86rem}
.info p{margin:10px 0 0;font-size:.9rem}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:8px;border:0;background:var(--chip);cursor:pointer;font-size:1.1rem;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:.9rem}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700}
.kv small{font-weight:400;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--field);border-radius:999px;padding:3px 10px 3px 6px;font-size:.84rem;cursor:pointer}
.pill:hover{border-color:var(--ink)}
.pill i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.pill em{font-style:normal;color:var(--ink-2);font-size:.78rem}
ol.stops{margin:6px 0 0;padding-left:24px;font-size:.9rem}
ol.stops li{padding:1px 0}
ol.stops li span{display:flex;justify-content:space-between;align-items:center;gap:6px}
ol.stops button.go{background:none;border:0;padding:0;cursor:pointer;text-align:left}
ol.stops button.go:hover{text-decoration:underline}
.colorin{width:44px;height:34px;padding:2px;border:1.5px solid var(--rule);border-radius:8px;background:var(--field);cursor:pointer}

@media (max-width: 880px){
  body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .map{order:1;height:68vh;min-height:420px}
  .side{order:2;border-right:0;overflow:visible}
  .side-scroll{overflow:visible}
  .dock{position:sticky;bottom:0;z-index:5}
  .info{max-height:62%}
  .maplegend{max-width:200px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Builder: the example packages card stands apart from the other groups */
.side section.acc.starter{margin-top:18px;border:1.5px solid var(--rule);border-radius:12px;padding:0 12px;background:var(--chip)}
.side section.acc.starter .acc-btn:hover{background:transparent}
.side section.acc.starter .acc-title{font-size:.98rem}
.muted-note{color:var(--ink-2);font-size:.78rem;margin-left:4px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
input[type="range"]{accent-color:var(--ink);width:100%}
.rng span{display:flex;justify-content:space-between}
.rng output{font-weight:600;color:var(--ink-2)}
.source{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.88rem}
.source p{margin:0 0 8px}
.frame-hint{margin:12px 0 0}
.swpick{position:relative;display:inline-flex;cursor:pointer}
.swpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.compass{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:210px}
.compass button{border:1.5px solid var(--rule);background:var(--field);border-radius:8px;padding:6px 0;cursor:pointer;font-weight:600}
.compass button[aria-pressed="true"],.btn.alt[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* Style page: the map sits on a page-sized artboard */
body[data-mode="style"] .map{background:var(--bg);display:flex;align-items:center;justify-content:center;padding-top:84px}
body[data-mode="style"] #svg{flex:none;box-shadow:0 2px 16px rgba(8,18,30,.2);background:#fff}
body[data-mode="style"] #svg.checker{background:conic-gradient(#e4e8ec 25%,#fff 0 50%,#e4e8ec 0 75%,#fff 0) 0 0/20px 20px}

/* View toggle at the top of the sidebar */
.viewtoggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 16px;padding:4px;background:var(--chip);border-radius:12px}
.viewtoggle button{display:flex;align-items:center;gap:9px;border:1.5px solid transparent;background:transparent;border-radius:9px;padding:8px 9px;cursor:pointer;text-align:left;color:var(--ink-2)}
.viewtoggle button:hover{color:var(--ink)}
.viewtoggle button[aria-pressed="true"]{background:var(--field);color:var(--ink);border-color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.viewtoggle svg{flex:none}
.viewtoggle strong{display:block;font-size:.93rem;line-height:1.15}
.viewtoggle small{display:block;font-size:.74rem;color:var(--ink-2);line-height:1.25}
.viewtoggle .ic-a,.viewtoggle .ic-b{stroke:currentColor}
.viewtoggle .ic-b{opacity:.55}
.viewtoggle .ic-st{fill:var(--field);stroke:currentColor;stroke-width:1.8}
.viewtoggle .ic-tx{fill:none;stroke:currentColor}
.viewtoggle .ic-pin{fill:currentColor}
.viewtoggle button[aria-pressed="true"] .ic-a{stroke:#d7263d}
.viewtoggle button[aria-pressed="true"] .ic-b{stroke:#1f78b4;opacity:1}
.viewtoggle button[aria-pressed="true"] .ic-tx{fill:var(--land);stroke:var(--ink)}
.viewtoggle button[aria-pressed="true"] .ic-pin{fill:#d7263d}
/* Floating legend in the builder */
.mapstack{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;flex-direction:column;align-items:stretch;gap:8px;width:max-content;min-width:200px;max-width:calc(100% - 28px);max-height:calc(100% - 120px);pointer-events:none}
.mapstack > *{pointer-events:auto}
.maplegend,.mapfacts{background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 4px 16px rgba(8,18,30,.14);font-size:.8rem}
.maplegend{min-width:150px;max-width:250px;min-height:0;overflow:auto}
.mapfacts{flex:none;contain:inline-size}
.mapfacts .lg-head,.maplegend .lg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:7px 10px 7px 12px;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--ink)}
.mapfacts .lg-head .chev{transition:transform .15s}
.mapfacts .lg-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
/* Facts stack one per row so the panel can match the legend's width */
.mapfacts .stats{margin:0;padding:0 10px 10px;gap:6px;grid-template-columns:1fr}
.mapfacts .stats div{display:flex;align-items:center;gap:10px;padding:6px 10px}
.mapfacts .stats dd{order:-1;margin:0;font-size:1.1rem;min-width:66px;white-space:nowrap}
.mapfacts .stats dt{font-size:.76rem}
.mapfacts #dmInfo{padding:0 10px 10px}
.mapfacts .dm-sum{font-size:.8rem;margin:0 2px 8px}
.mapfacts .dm-cov{margin:0;gap:6px;grid-template-columns:1fr}
.mapfacts .dm-cov div{display:flex;align-items:center;gap:10px;padding:6px 10px}
.mapfacts .dm-cov strong{font-size:1.1rem;min-width:52px}
.maplegend .lg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:7px 10px 7px 12px;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--ink)}
.maplegend .lg-head .chev{transition:transform .15s}
.maplegend .lg-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.maplegend h4{margin:4px 12px 2px;font-size:.72rem;font-weight:600;color:var(--ink-2)}
.maplegend ul{list-style:none;margin:0;padding:0 12px 6px}
.maplegend li{display:flex;align-items:center;gap:8px;line-height:1.45;padding:1px 0}
.maplegend li .swsvg{flex:none}
.maplegend #mapLegendBody{padding-bottom:4px}

const W = 1700, H = 1600;
const LON0 = -107.3, LON1 = -93.3, LAT0 = 25.7, LAT1 = 36.65;
const KX = Math.cos(31 * Math.PI / 180);
const SC = Math.min((W - 120) / ((LON1 - LON0) * KX), (H - 120) / (LAT1 - LAT0));
const OX = (W - (LON1 - LON0) * KX * SC) / 2, OY = (H - (LAT1 - LAT0) * SC) / 2;

const unproj = (x, y) => [LAT1 - (y - OY) / SC, LON0 + (x - OX) / (KX * SC)];

function regionOf(lat, lon){
  let best = 'central', bd = Infinity;
  for(const [r, la, lo] of D.REGION_SEEDS){ const d = (la-lat)**2 + ((lo-lon)*KX)**2; if(d < bd){ bd = d; best = r; } }
  return best;
}
function hav(a, b){
  const R = 3958.8, r = Math.PI/180, dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

function mkNode(o){ o.g = proj(o.lat, o.lon); o.region = regionOf(o.lat, o.lon); NODES.push(o); N[o.id] = o; return o; }

/* ---------- Diagram layout: metro magnification, then declutter ---------- */
// Each metro gets a radial magnifier; applying them one after another keeps the map free of fold-overs
const FISH = [];
D.FISHEYE.forEach(f => { const c = fishApply(proj(f.lat, f.lon)); FISH.push(Object.assign({c}, f)); });

  let x = p[0], y = p[1];

  return g;
}

  const base = NODES.map(n => fishApply(n.g));

    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){

  for(const p of pts){ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }
  const s = Math.min((W-140)/(x1-x0), (H-140)/(y1-y0));
  LAYOUT.s = s; LAYOUT.ox = (W - (x1-x0)*s)/2 - x0*s; LAYOUT.oy = (H - (y1-y0)*s)/2 - y0*s;
  NODES.forEach((n,i) => n.s = [pts[i][0]*s + LAYOUT.ox, pts[i][1]*s + LAYOUT.oy]);

/* ---------- Side-by-side lines ----------

function bundleLines(order, GAP){

      const items = g.items;

/* ---------- Spatial grid for label placement ---------- */
function Grid(c){
  const m = new Map(), k = (x,y) => x + ',' + y;
  return {
    add(b, o){ o.b = b; for(let x=Math.floor(b[0]/c); x<=Math.floor(b[2]/c); x++) for(let y=Math.floor(b[1]/c); y<=Math.floor(b[3]/c); y++){ const kk=k(x,y); if(!m.has(kk)) m.set(kk,[]); m.get(kk).push(o); } },
    hits(b, skip){ const seen = new Set(); let n = 0;
      for(let x=Math.floor(b[0]/c); x<=Math.floor(b[2]/c); x++) for(let y=Math.floor(b[1]/c); y<=Math.floor(b[3]/c); y++){
        const a = m.get(k(x,y)); if(!a) continue;
        for(const o of a){ if(seen.has(o) || o === skip || (skip && o.id === skip.id)) continue; seen.add(o);
          if(o.b[0] < b[2] && o.b[2] > b[0] && o.b[1] < b[3] && o.b[3] > b[1]) n++; } }

}

/* ---------- Demand layer: filter, classify and draw ---------- */
// Sequential ramps: light maps run yellow to deep plum; dark maps run dim purple to bright yellow, so more trips always stand out more
const DM_RAMPS = {light:['#f9b642','#f2792e','#d9412b','#a21b3c','#4f0c3a'], dark:['#5b4a8b','#9b4f96','#d9576b','#f5934a','#fbe36b']};

  let list, uas = null;
  if(UA){
    uas = UA_LIST.filter(a => { a.popNow = uaPopNow(a); return a.popNow > 0 && a.popNow >= dm.minPop; });
    const ok = new Set(uas.map(a => a.id));
    list = uaPairs().filter(p => ok.has(p.a) && ok.has(p.b) && p.mi >= dm.minMiles && p.t >= dm.minTrips);
  } else {
    list = OD.filter(r => !removed.has(r.a) && !removed.has(r.b) && (!shown || (shown.has(r.a) && shown.has(r.b)))
      && (dm.scope === 'all' || r.same)

  const eligible = list.length;

    if(dm.limit === 'rank') list = list.slice(0, Math.max(1, dm.topN|0));
    else if(dm.limit === 'pct') list = list.slice(0, Math.max(1, Math.ceil(list.length * dm.topPct/100)));

  else if(dm.color === 'quartile' && vals.length > 4){ const s = vals.slice().sort((a, b) => a - b), q = p => s[Math.min(s.length-1, Math.floor(p*(s.length-1)))]; breaks = [q(.25), q(.5), q(.75)]; }

}
// Scaled widths run from about a third of the base width to about six times it; the 0.6 power spreads out the middle of the range
function odWidth(t, set, u){ const dm = state.dm; return (dm.scale ? dm.width * clamp(0.35 + 5.5*Math.pow(t/set.max, 0.6), 0.35, 5.85) : dm.width) * u; }

// Which shown pairs your network connects: directly on one line, or with transfers
function coverage(set, vis){

    for(let i = 1; i < v.stops.length; i++){ const a = find(v.stops[0]), b = find(v.stops[i]); if(a !== b) parent.set(a, b); } }
  let tot = 0, conn = 0, direct = 0, nConn = 0;
  for(const r of set.list.flatMap(p => p.recs || [p])){
    tot += r.t;
    if(!parent.has(r.a) || !parent.has(r.b) || find(r.a) !== find(r.b)) continue;
    conn += r.t; nConn++;

}

/* ---------- Suggested corridors (gravity model) ---------- */
const sugColor = t => state.typeColors[t] || D.TYPES[t].ghost;

    let best = null;

        else if(Math.min(popOf(nodes[i]), popOf(nodes[j])) < 300000 && popOf(nodes[k]) >= 0.5*Math.min(popOf(nodes[i]), popOf(nodes[j])) && Math.max(dist[i][k], dist[k][j]) < 0.92*d) pruned = true; }

    }

}
function pairSuggestion(a, b){

  const A = N[a], B = N[b]; if(!A.pop || !B.pop) return null;

}

  else if(sugEl){ const s = SUG && SUG.edges.find(x => x.id === sugEl.dataset.sug); if(s) text = `Suggested ${D.TYPES[s.type].name.toLowerCase()}: ${N[s.a].name} – ${N[s.b].name}`; }
  if(!text){ tip.hidden = true; return; }
  const r = mapEl.getBoundingClientRect();
  tip.textContent = text; tip.hidden = false;
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if(x + tip.offsetWidth > r.width - 8) x = e.clientX - r.left - tip.offsetWidth - 10;
  tip.style.transform = `translate(${x}px, ${y}px)`;
});
svg.addEventListener('pointerleave', () => tip.hidden = true);

/* ---------- Layout toggle and theme ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let anim = 0;
function setLayout(geo){
  const target = geo ? 1 : 0;
  $('btnDiagram').setAttribute('aria-pressed', String(!geo)); $('btnGeo').setAttribute('aria-pressed', String(geo));
  if(state.t === target) return;
  cancelAnimationFrame(anim); state.t = target; save();
  if(reduced){ render(); return; }
  const from = 1 - target, t0 = performance.now(), dur = 650;
  const step = now => { const u = Math.min(1, (now-t0)/dur), e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2;
    state.t = u === 1 ? target : from + (target-from)*e; render(); if(u < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}

const root = document.documentElement;
const sysDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
const curTheme = () => root.getAttribute('data-theme') || (sysDark() ? 'dark' : 'light');
function themeBtns(){ document.querySelectorAll('[data-uitheme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.uitheme === curTheme()))); }
function setTheme(t){ root.setAttribute('data-theme', t); try{ localStorage.setItem('txrail.theme', t); }catch(e){} themeBtns(); if(dmOn()) render(); }
try{
  let t = localStorage.getItem('txrail.theme');
  if(!t || localStorage.getItem('txrail.theme.v') !== '2'){ t = 'paper'; localStorage.setItem('txrail.theme', t); localStorage.setItem('txrail.theme.v', '2'); }
  if(['light','paper','dark'].includes(t)) root.setAttribute('data-theme', t);
}catch(e){ root.setAttribute('data-theme', 'paper'); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeBtns);
themeBtns();

/* ---------- Start ---------- */
if(STYLE){
  const ns = 'http://www.w3.org/2000/svg';
  const css = document.createElementNS(ns, 'style'); css.id = 'artCss'; svg.insertBefore(css, svg.firstChild);
  const bg = document.createElementNS(ns, 'rect'); bg.id = 'artBg'; bg.setAttribute('class', 'art-bg'); bg.setAttribute('x', 0); bg.setAttribute('y', 0); svg.insertBefore(bg, view);
  const og = document.createElementNS(ns, 'g'); og.id = 'overG'; svg.appendChild(og);
  layoutArt(); applyArt(); loadFont(state.st.font);
  // Pick up edits made in the builder in another tab
  window.addEventListener('storage', e => { if(e.key === NET_KEY) location.reload(); });
}
{ const tools = document.createElement('div'); tools.className = 'maptools'; tools.id = 'mapTools';
  tools.innerHTML = (BUILD ? `<div class="tool-search"><label class="tool-label" for="q">Find or add a city</label><input id="q" list="cityList" placeholder="Any Texas city, like Temple" autocomplete="off"><datalist id="cityList"></datalist></div>
    <div class="tool-group"><span class="tool-label" id="modeLbl">Mode</span>${modeToggle()}</div>` : '')
    + `<div class="tool-group"><span class="tool-label" id="viewLbl">Map style</span>${viewToggle()}</div>`;
  mapEl.appendChild(tools);
  tools.querySelectorAll('.viewtoggle').forEach(g => g.setAttribute('aria-labelledby', g.classList.contains('modeswitch') ? 'modeLbl' : 'viewLbl'));
}
sideSkeleton();
{ const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'infobtn'; btn.id = 'aboutBtn';
  btn.setAttribute('aria-label', 'About the data'); btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', 'aboutPop'); btn.textContent = 'i';
  const pop = document.createElement('div'); pop.className = 'aboutpop'; pop.id = 'aboutPop'; pop.hidden = true; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'About the data');
  pop.innerHTML = `<h4>About the data</h4>
    <p><strong>Populations.</strong> ${D.SOURCE}, for every Census place of 25,000 or more, plus smaller towns with rail stations today.</p>
    <p><strong>Weekday trips.</strong> Replica, Spring 2026 model: average weekday trips between city pairs in both directions. These are modeled estimates rather than counts, so treat them as indicative.</p>
    <p><strong>Distances and times.</strong> Route lengths use a 1.15 circuity factor on straight-line distance. Drive times assume ${DRIVE_MPH} mph over road miles from the trip data where available.</p>
    <p>Example packages, speeds and suggestions are brainstorming aids, not engineered alignments.</p>`;
  mapEl.appendChild(btn); mapEl.appendChild(pop); }
function setAbout(open){ const b = $('aboutBtn'), p = $('aboutPop'); if(!b) return; p.hidden = !open; b.setAttribute('aria-expanded', String(open)); }
document.addEventListener('click', e => { const p = $('aboutPop'); if(p && !p.hidden && !e.target.closest('#aboutPop') && !e.target.closest('#aboutBtn')) setAbout(false); });
if(BUILD){
  const stack = document.createElement('div'); stack.className = 'mapstack'; stack.id = 'mapStack';
  stack.innerHTML = `<section class="mapfacts" id="mapFacts" aria-label="Quick facts"><button type="button" class="lg-head" id="factsToggle" aria-expanded="${state.factsOpen}" aria-controls="factsBody"><span>Quick facts</span>${CHEV}</button><div id="factsBody"${state.factsOpen ? '' : ' hidden'}><dl class="stats" id="stats"></dl><div id="dmInfo"></div></div></section><aside class="maplegend" id="mapLegend" aria-label="Map legend"></aside>`;
  mapEl.appendChild(stack);
}
if(BUILD){ $('newType').value = state.newType; if(state.showSug) computeSuggestions(); save(); }
renderSide();
fitView();
if(STYLE && !restoreView()) fitView();
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
let lastW = 0;
window.addEventListener('resize', () => {
  if(STYLE){ layoutArt(); return; }
  const w = svg.getBoundingClientRect().width; if(Math.abs(w - lastW) > 40){ lastW = w; fitView(); }
});
window.__txr = {render, computeSuggestions, state, N, NODES, UAN, get SUG(){ return SUG; }, exportSvgString,
  look(id, m){ const [w, h] = viewSize(); vp.k = vp.kFit*m; const p = pos(N[id]); vp.x = w/2 - p[0]*vp.k; vp.y = h/2 - p[1]*vp.k; applyView(); render(); }};
})();

</script>
